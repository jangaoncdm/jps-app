<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6FE0">
<meta name="robots" content="noindex">
<title>Pashu Seva Assigned Care</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Apollo 24|7 cloned structurally: light header with location + search and a mic, a circular
   category rail, an offer carousel with dots, the "Book an appointment for" split, a 4-up
   specialty grid, doctor cards with fee + orange CONSULT, and a 5-tab bottom bar.
   Apollo's structure with our own accent: #02475B ink, #1D6FE0 action blue,
   #00B38E green, #F7F8F5 ground. Blue over orange because a government service should
   read as official rather than promotional, and it holds up better in direct sun. */
:root{
  --ink:#02475B; --ink-2:#67909E; --ink-3:#9BB5BF; --navy:#01364A;
  --cta:#1D6FE0; --cta-d:#1557B8; --cta-50:#E8F0FD;
  --green:#00B38E; --green-50:#E5F7F3;
  --app:#F7F8F5; --card:#FFFFFF; --line:#E8EDF0; --line-2:#D4DEE3;
  --red:#D0342C; --red-50:#FCEDEC; --amber:#A96D00; --amber-50:#FFF6E6;
  --wa:#25D366; --star:#FFB800;
  --fb:"Noto Sans Telugu","Inter",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#01222E;font-family:var(--fb);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
img{display:block;max-width:100%}

.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;background:var(--app);overflow:hidden;
  display:flex;flex-direction:column}
@media (min-width:760px){
  .stage{padding:22px}
  .device{width:400px;height:min(860px,96vh);border-radius:40px;
    box-shadow:0 0 0 9px #02475B,0 30px 70px rgba(0,0,0,.6)}
}

/* splash */
/* Welcome: four staged beats, then the whole panel lifts away to reveal the app.
   Long enough to register, short enough that nobody waits for it. */
#splash{position:absolute;inset:0;z-index:90;background:var(--cta);color:#fff;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
#splash:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  background:rgba(255,255,255,.07);animation:ring 2.6s cubic-bezier(.2,.8,.3,1) both}
#splash:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  background:rgba(255,255,255,.07);animation:ring 2.6s .12s cubic-bezier(.2,.8,.3,1) both}
@keyframes ring{0%{transform:scale(0);opacity:0}45%{opacity:1}100%{transform:scale(1);opacity:1}}
#splash.gone{animation:so .62s cubic-bezier(.65,0,.35,1) forwards}
@keyframes so{to{transform:translateY(-102%);visibility:hidden}}
.sM{position:relative;z-index:2;width:92px;height:92px;border-radius:29px;background:#fff;
  color:var(--cta);display:flex;align-items:center;justify-content:center;font-size:46px;
  animation:si 1s cubic-bezier(.16,1.5,.4,1) both}
@keyframes si{0%{transform:scale(.2) rotate(-14deg);opacity:0}
  55%{transform:scale(1.07) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
.sN{position:relative;z-index:2;font-size:21px;font-weight:800;letter-spacing:-.01em;
  animation:su .6s .42s cubic-bezier(.2,.9,.3,1) both}
.sS{position:relative;z-index:2;font-size:12px;opacity:.88;margin-top:-7px;
  animation:su .6s .56s cubic-bezier(.2,.9,.3,1) both}
@keyframes su{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sB{position:relative;z-index:2;width:132px;height:4px;border-radius:9px;
  background:rgba(255,255,255,.26);overflow:hidden;margin-top:10px;animation:su .5s .7s both}
.sB i{display:block;height:100%;border-radius:9px;background:#fff;
  animation:sl 1.5s .78s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes sl{0%{width:0}55%{width:62%}100%{width:100%}}
#replay{position:absolute;right:13px;bottom:calc(126px + env(safe-area-inset-bottom,0px));z-index:45;
  width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);font-size:16px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(2,71,91,.22)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 14px}
.screen{animation:in .26s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* Apollo header: white, not a coloured bar */
.ahd{background:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 13px;
  border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:8px}
.lrow .pin{font-size:15px;color:var(--cta)}
.lrow .lb{font-size:10.5px;color:var(--ink-2);font-weight:600;line-height:1.2}
.lrow .lv{font-size:13.5px;font-weight:700;line-height:1.25}
.lrow .av{width:34px;height:34px;border-radius:50%;background:var(--green-50);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:15px;margin-left:auto;flex:none}
.sbar{display:flex;align-items:center;gap:9px;background:var(--app);border:1px solid var(--line-2);
  border-radius:9px;padding:11px 13px;margin-top:11px;font-size:13.5px;color:var(--ink-3)}
.sbar .mic{margin-left:auto;color:var(--cta);font-size:15px}

/* circular category rail */
.cats{display:flex;gap:4px;padding:13px 10px 3px;overflow-x:auto;scrollbar-width:none;background:#fff}
.cats::-webkit-scrollbar{display:none}
.cats b{flex:none;width:72px;text-align:center;font-size:10px;font-weight:700;line-height:1.25;
  color:var(--ink)}
.cats i{display:flex;width:50px;height:50px;margin:0 auto 5px;border-radius:50%;font-style:normal;
  align-items:center;justify-content:center;font-size:24px;background:var(--green-50)}
.cats b:nth-child(2) i{background:var(--cta-50)}
.cats b:nth-child(3) i{background:#E9F1FB}
.cats b:nth-child(4) i{background:#FBEAF2}
.cats b:nth-child(5) i{background:#F0EDFB}

/* offer carousel */
.carou{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 14px;margin-top:14px}
.carou::-webkit-scrollbar{display:none}
.ban{flex:none;width:272px;border-radius:13px;padding:14px 15px;display:flex;gap:11px;
  align-items:center;color:#fff}
.ban.a{background:linear-gradient(110deg,#0A6E8A,#02475B)}
.ban.b{background:linear-gradient(110deg,#1557B8,#1D6FE0)}
.ban .ic{font-size:30px}
.ban b{display:block;font-size:14px;font-weight:800}
.ban span{font-size:11.5px;opacity:.9}
.dots{display:flex;gap:5px;justify-content:center;margin-top:9px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dots i.on{width:16px;border-radius:9px;background:var(--cta)}

/* section header */
.sh{display:flex;align-items:center;margin:20px 0 10px}
.sh h2{font-size:15px;font-weight:800;flex:1;letter-spacing:-.01em}
.sh b{font-size:12px;font-weight:700;color:var(--cta)}

/* "Book an appointment for" split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split b{background:var(--card);border-radius:12px;padding:13px;display:block;
  box-shadow:0 1px 3px rgba(2,71,91,.07)}
.split .e{font-size:26px;display:block;margin-bottom:7px}
.split .t{font-size:13px;font-weight:800;line-height:1.25}
.split .s{font-size:10.5px;color:var(--ink-2);margin-top:2px}

/* specialty grid, Apollo's 4-up with circular illustrations */
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.specs b{background:var(--card);border-radius:11px;padding:10px 3px 8px;text-align:center;display:block;
  font-size:9.5px;font-weight:700;line-height:1.25;box-shadow:0 1px 3px rgba(2,71,91,.06)}
.specs i{display:flex;width:40px;height:40px;margin:0 auto 5px;border-radius:50%;font-style:normal;
  align-items:center;justify-content:center;font-size:21px;background:var(--app)}

/* doctor card - Apollo's row with fee and orange CONSULT */
.doc{background:var(--card);border-radius:13px;padding:13px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(2,71,91,.07);display:flex;gap:12px}
.doc .ph{width:56px;height:56px;border-radius:50%;background:var(--green-50);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:27px;position:relative}
.doc .ph em{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;
  background:var(--green);border:2.5px solid #fff}
.doc .nm{font-size:14px;font-weight:800;letter-spacing:-.01em}
.doc .sp{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.doc .mt{font-size:11px;color:var(--ink-3);margin-top:3px}
.doc .rt{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;
  background:var(--green-50);color:var(--green);padding:2px 7px;border-radius:5px;margin-top:6px}
.doc .ft{display:flex;align-items:center;gap:9px;margin-top:9px}
.doc .fee{font-size:13px;font-weight:800;color:var(--green)}
.doc .fee s{color:var(--ink-3);font-weight:600;font-size:11.5px;margin-right:5px}
.doc .cs{margin-left:auto;background:var(--cta);color:#fff;border-radius:7px;padding:8px 16px;
  font-size:12.5px;font-weight:800}
.docr{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;padding:0 14px;margin-inline:-14px}
.docr::-webkit-scrollbar{display:none}
.docr .doc{flex:none;width:232px;flex-direction:column;margin:0}
.docr .doc .cs{margin-left:0;text-align:center;width:100%}
.docr .doc .ft{flex-direction:column;align-items:stretch;gap:7px}

.ihd{display:flex;align-items:center;gap:11px;background:#fff;
  padding:calc(13px + env(safe-area-inset-top,0px)) 14px 12px;border-bottom:1px solid var(--line)}
.bk{width:34px;height:34px;border-radius:50%;background:var(--app);display:flex;align-items:center;
  justify-content:center;font-size:16px;flex:none}
.ihd .t{font-size:16px;font-weight:800;flex:1;min-width:0}

.card{background:var(--card);border-radius:13px;padding:14px;margin-top:11px;
  box-shadow:0 1px 3px rgba(2,71,91,.07)}
.row{display:flex;gap:10px;align-items:center}
.sp1{flex:1;min-width:0}
.sub{font-size:13px;color:var(--ink-2);line-height:1.5}
.en{font-size:11px;color:var(--ink-3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;
  border-radius:9px;background:var(--cta);color:#fff;font-weight:800;font-size:15px}
.btn:active{transform:scale(.977)}
.btn.g{background:#fff;color:var(--cta);box-shadow:inset 0 0 0 1.6px var(--cta)}
.btn.t{background:var(--ink)}
.btn.w{background:var(--wa)}
.btn.sm{min-height:38px;font-size:12.5px;border-radius:7px;width:auto;padding:0 15px}
.pill{display:inline-flex;gap:4px;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:800}
.p-live{background:var(--green-50);color:var(--green)}
.p-wait{background:var(--amber-50);color:var(--amber)}
.p-red{background:var(--red-50);color:var(--red)}
input,select,textarea{width:100%;min-height:46px;padding:12px 13px;font:inherit;font-size:14.5px;
  background:#fff;border:1.5px solid var(--line-2);border-radius:9px;color:var(--ink)}
textarea{min-height:80px;resize:none}
label{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin:12px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips b{flex:none;padding:8px 13px;border-radius:7px;background:#fff;font-size:12.5px;font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink-2)}
.chips b.on{background:var(--ink);color:#fff;box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:#fff;border-radius:11px;padding:0;overflow:hidden;text-align:center;font-size:12px;
  font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.tile img{width:100%;height:62px;object-fit:cover}
.tile span{display:block;padding:7px 3px}
.tile.on{box-shadow:inset 0 0 0 2.4px var(--cta)}
.sk{height:13px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.sk+.sk{margin-top:9px}
.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,#fff,transparent);animation:sh 1.25s linear infinite}
@keyframes sh{to{transform:translateX(100%)}}
.rail{list-style:none;padding:0;margin:0}
.rail li{position:relative;padding:0 0 15px 22px;font-size:12.5px}
.rail li:before{content:"";position:absolute;left:2px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--green)}
.rail li:after{content:"";position:absolute;left:6px;top:15px;bottom:0;width:1.5px;background:var(--line)}
.rail li:last-child{padding-bottom:0}.rail li:last-child:after{display:none}
.rail b{display:block}.rail span{font-size:10.5px;color:var(--ink-3)}
.rail li.w:before{background:var(--line-2)}
.seg{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none;background:#fff;
  border-bottom:1px solid var(--line)}
.seg::-webkit-scrollbar{display:none}
.seg b{flex:none;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:7px;background:var(--app);
  color:var(--ink-2)}
.seg b.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:10px 5px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.wd{background:var(--red-50);border:1.5px solid #F3D3D1;border-radius:10px;padding:11px;margin:11px 0}
.wd .t{font-weight:800;color:var(--red);font-size:12.5px;margin-bottom:4px}
.wd div{font-size:12px}.wd em{font-style:normal;font-weight:800;color:var(--red)}
.rxrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rxrow:last-child{border:0}
.rxrow .n{width:14px;color:var(--ink-3);font-weight:800;flex:none}
.rxrow .d{flex:none;width:68px;text-align:right;font-weight:800;font-size:11.5px}

/* Apollo 5-tab bar */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:#fff;border-top:1px solid var(--line);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.nav b{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:700;
  color:var(--ink-3);padding:3px 1px}
.nav b i{font-style:normal;font-size:18px}
.nav b.on{color:var(--cta)}
.nav b.on i{filter:none}
#index{position:absolute;inset:0;z-index:70;background:var(--app);display:flex;flex-direction:column;
  animation:in .25s both}
#index .hd{padding:calc(14px + env(safe-area-inset-top,0px)) 14px 9px;display:flex;align-items:center;gap:10px}
#index .body{flex:1;overflow-y:auto;padding:0 14px 22px}
.grp{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:14px 0 7px}
.ix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ix b{background:#fff;border-radius:10px;padding:10px 11px;font-size:11.5px;font-weight:700;display:block;
  line-height:1.3;box-shadow:0 1px 3px rgba(2,71,91,.06)}
.ix b i{display:block;font-style:normal;font-size:9.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
#mapBtn{position:absolute;right:13px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;
  width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(2,71,91,.3)}
/* ---------------- motion ----------------
   Everything that loads, waits or responds to a tap says so. */

/* cards and rows arrive in sequence rather than all at once */
.screen .card,.screen .doc,.screen .split b,.screen .specs b,.screen .ban{
  animation:rise .34s cubic-bezier(.2,.9,.3,1) both}
.screen .card:nth-child(2){animation-delay:.04s}
.screen .card:nth-child(3){animation-delay:.08s}
.screen .card:nth-child(4){animation-delay:.12s}
.screen .card:nth-child(5){animation-delay:.16s}
.screen .specs b:nth-child(2){animation-delay:.03s}
.screen .specs b:nth-child(3){animation-delay:.06s}
.screen .specs b:nth-child(4){animation-delay:.09s}
.screen .specs b:nth-child(5){animation-delay:.12s}
.screen .specs b:nth-child(6){animation-delay:.15s}
.screen .specs b:nth-child(7){animation-delay:.18s}
.screen .specs b:nth-child(8){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

/* the category rail deals itself in */
.cats b{animation:deal .4s cubic-bezier(.2,1.1,.35,1) both}
.cats b:nth-child(2){animation-delay:.05s}
.cats b:nth-child(3){animation-delay:.1s}
.cats b:nth-child(4){animation-delay:.15s}
.cats b:nth-child(5){animation-delay:.2s}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}

/* anything tappable answers the thumb */
.card,.split b,.specs b,.cats b,.tile,.doc,.chips b,.seg b,.ban{transition:transform .11s ease}
.card:active,.split b:active,.specs b:active,.cats b:active,.tile:active,.doc:active,
.chips b:active,.seg b:active,.ban:active{transform:scale(.972)}

/* a button that is working looks like it */
.btn{position:relative;overflow:hidden}
.btn.busy{pointer-events:none;color:transparent !important}
.btn.busy:after{content:"";position:absolute;top:50%;left:50%;width:19px;height:19px;
  margin:-9.5px 0 0 -9.5px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;animation:spin .62s linear infinite}
.btn.g.busy:after{border-color:rgba(29,111,224,.3);border-top-color:var(--cta)}
@keyframes spin{to{transform:rotate(360deg)}}

/* inputs acknowledge focus */
input,select,textarea{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--cta);
  box-shadow:0 0 0 3.5px var(--cta-50)}

/* a chosen tile snaps */
.tile.on{animation:snap .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes snap{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}

/* toast for actions that have no screen of their own */
#toast{position:absolute;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:60;
  transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;font-size:13px;
  font-weight:700;padding:11px 17px;border-radius:11px;pointer-events:none;
  transition:opacity .22s,transform .22s;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* live status dots actually pulse */
.p-live:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>

<div class="stage">
  <div class="device">
    <div id="splash">
      <div class="sM">🐄</div>
      <div class="sN">Jangaon Pashu Seva</div>
      <div class="sS">Govt. Veterinary Care · Jangaon</div>
      <div class="sB"><i></i></div>
    </div>
    <div class="scroll" id="scroll"><div id="view"></div></div>
    <div id="nav"></div>
    <div id="toast"></div>
    <button id="replay" title="Replay the welcome">↻</button>
    <button id="mapBtn">⠿</button>
  </div>
</div>

<script>
var TK = 'JPS-261009-004';
function im(n) { return 'img/' + n + '.jpg'; }

/* The user never picks. Their Gram Panchayat maps to one facility, and that facility
   has an on-call roster. This is the real routing: SEED_GPS -> SEED_FACILITIES -> SEED_STAFF. */
var CENTRE = {
  code:'AH-01', name:'Area Veterinary Hospital', village:'Jangaon', km:'4.2',
  hours:'8:00 am – 5:00 pm', phone:'+91 87654 32100',
  incharge:'Dr Srinivas',
  roster:[ { n:'Dr Srinivas', r:'In-charge', av:'👨‍⚕️', on:1 },
           { n:'Dr Rajitha', r:'Assistant Surgeon', av:'👩‍⚕️', on:1 },
           { n:'K. Kumaraswamy', r:'Attendant', av:'🧑‍🌾', on:0 } ]
};
/* A roster row, not a product card: no fee, no rating, no Consult button, because the

var FARMER = ['home','centre','cases','vacc','new1','new2','new3','sent','track','rx','tips',
              'emg','calling','records','sending'];
function paintNav(id) {
  var show = FARMER.indexOf(id) >= 0;
  document.getElementById('nav').innerHTML = show ? '<div class="nav">' + FNAV.map(function (n) {
    return '<b class="' + (n[0] === id ? 'on' : '') + '" onclick="go(\'' + n[0] + '\')"><i>' +
      n[1] + '</i>' + n[2] + '</b>'; }).join('') + '</div>' : '';
  document.getElementById('mapBtn').style.display = id === 'signin' ? 'none' : 'flex';
}
/* Screens that fetch show their skeleton first. Forms do not - a shimmer in front of a
   field the user is about to type in is just a delay wearing a costume. */
var FETCHES = ['home','centre','cases','track','rx','records','vacc','tips','queue','case',
               'dash','attend','stock','broadcast'];
function skeleton() {
  return '<div class="pad" style="padding-top:16px">' +
    '<div class="card"><div class="sk" style="width:46%"></div><div class="sk"></div>' +
      '<div class="sk" style="width:72%"></div></div>' +
    '<div class="card"><div class="sk" style="width:58%"></div><div class="sk"></div></div>' +
    '<div class="card"><div class="sk" style="width:38%"></div><div class="sk"></div>' +
      '<div class="sk" style="width:64%"></div></div></div>';
}
/* the offer rail moves on its own, and the dots follow it */
function autoCarousel() {
  var c = document.querySelector('.carou');
  if (!c) return;
  clearInterval(window._car);
  window._car = setInterval(function () {
    if (!document.body.contains(c)) { clearInterval(window._car); return; }
    var w = c.firstElementChild ? c.firstElementChild.offsetWidth + 10 : 280;
    var next = c.scrollLeft + w >= c.scrollWidth - 20 ? 0 : c.scrollLeft + w;
    c.scrollTo({ left: next, behavior: 'smooth' });
    var d = document.querySelectorAll('.dots i'), k = Math.round(next / w);
    for (var i = 0; i < d.length; i++) d[i].className = i === k ? 'on' : '';
  }, 3200);
}

/* dashboard figures count up instead of just appearing */
function countUp() {
  var els = document.querySelectorAll('[data-count]');
  for (var i = 0; i < els.length; i++) (function (el) {
    var to = parseFloat(el.getAttribute('data-count')), suf = el.getAttribute('data-suf') || '';
    var t0 = Date.now();
    var tick = function () {
      var k = Math.min(1, (Date.now() - t0) / 700);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suf;
      if (k < 1) requestAnimationFrame(tick);
    };
    tick();
  })(els[i]);
}

function go(id) {
  if (!SCREENS[id]) return;
  var v = document.getElementById('view');
  document.getElementById('scroll').scrollTop = 0;
  paintNav(id);
  var ix = document.getElementById('index'); if (ix) ix.remove();
  var paint = function () {
    v.innerHTML = '<div class="screen">' + SCREENS[id]() + '</div>';
    autoCarousel();
    countUp();
  };
  if (FETCHES.indexOf(id) >= 0) { v.innerHTML = skeleton(); setTimeout(paint, 520); }
  else paint();
}
function pick(el) {
  var p = el.parentNode.children;
  for (var i = 0; i < p.length; i++) p[i].classList.remove('on');
  el.classList.add('on');
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'on';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.className = ''; }, 1900);
}

/* every primary action spins before it resolves, so a slow network never looks like a dead tap */
function busy(el, ms, then) {
  el.classList.add('busy');
  setTimeout(function () { el.classList.remove('busy'); then(); }, ms || 700);
}

function submitReq() { go('sending'); setTimeout(function () { go('sent'); }, 1500); }
